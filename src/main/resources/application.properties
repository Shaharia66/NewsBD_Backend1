# ===== SERVER =====
server.port=8080

# ===== DATABASE (MySQL) =====
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Dhaka

# ===== FLYWAY =====
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration

# ===== CACHE =====
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=15m

# ===== JWT =====
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration=${APP_JWT_EXPIRATION}

# ===== NEWS APIS =====
app.gnews.key=${APP_GNEWS_KEY}
app.gnews.url=https://gnews.io/api/v4
app.guardian.key=${APP_GUARDIAN_KEY}
app.guardian.url=https://content.guardianapis.com
app.mediastack.key=${APP_MEDIASTACK_KEY}
app.mediastack.url=http://api.mediastack.com/v1


# ===== GROQ AI (Free - replaces Claude) =====
app.groq.api-key=${APP_GROQ_API_KEY}

# ===== OAUTH2 =====
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/google

#spring.security.oauth2.client.registration.facebook.client-id=YOUR_FACEBOOK_CLIENT_ID
#spring.security.oauth2.client.registration.facebook.client-secret=YOUR_FACEBOOK_CLIENT_SECRET
#spring.security.oauth2.client.registration.facebook.scope=email,public_profile

# ===== CORS =====
app.cors.allowed-origins=http://localhost:3000

# Force base URL for production
server.forward-headers-strategy=framework


# ===== SCHEDULER =====
app.scheduler.news-fetch-cron=0 */15 * * * *


# ===== RATE LIMITING =====
app.rate-limit.requests-per-minute=60
app.rate-limit.ai-requests-per-minute=10

# ===== LOGGING =====
logging.level.com.newsbd=INFO
logging.level.org.springframework.security=WARN


